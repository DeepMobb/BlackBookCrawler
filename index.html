<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Black Book – ny opgave</title>
<style>
  :root {
    --red: #c4001a;
    --red-dark: #9e0015;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #dcdce0;
    --bg: #f4f4f5;
    --card: #ffffff;
    --ok: #1f8a4c;
    --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  header {
    background: var(--red);
    color: #fff;
    padding: 14px 20px;
    font-weight: 700;
    letter-spacing: .04em;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  #status { font-weight: 400; font-size: 14px; letter-spacing: 0; opacity: .9; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 0 0 4px; font-size: 19px; }
  .lead { margin: 0 0 8px; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  .opt { font-weight: 400; color: var(--muted); }
  input, textarea, select {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  textarea { min-height: 130px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: transparent; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--red);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: var(--red-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 18px; padding: 12px 14px; border-radius: 8px; display: none; white-space: pre-wrap; }
  .msg.ok { display: block; background: #e7f5ed; color: var(--ok); }
  .msg.err { display: block; background: #fbeaea; color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <span id="status">Ikke logget ind</span>
</header>
<main>

  <!-- Login som crawler-konto. Vises kun indtil der er logget ind. -->
  <div class="card" id="loginCard">
    <h2>Log ind som crawler-konto</h2>
    <p class="lead">Login gemmes kun i denne fane og forsvinder, når den lukkes.</p>
    <form id="loginForm" novalidate>
      <label for="username">Brugernavn</label>
      <input id="username" name="username" value="7100" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button id="loginBtn" type="submit">Log ind</button>
      <div id="loginMsg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <!-- Selve frontpagen -->
  <div class="card hidden" id="taskCard">
    <h1>The Black Book</h1>
    <p class="lead">Skriv din idé eller forbedring, så kommer den direkte på tavlen.</p>
    <form id="taskForm" novalidate>
      <label for="headline">Overskrift</label>
      <input id="headline" name="headline" maxlength="150" required autocomplete="off">

      <label for="description">Beskrivelse <span class="opt">(valgfri)</span></label>
      <textarea id="description" name="description" maxlength="4000"></textarea>

      <label for="taskStatus">Status</label>
      <select id="taskStatus" name="taskStatus"></select>

      <button id="taskBtn" type="submit">Opret opgave</button>
      <div id="taskMsg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </div>

</main>

<script>
// ---------- Konfiguration ----------
const CONFIG = {
  apiBase: "https://backend.eropex.com/api",

  // Tavlen "The Black Book" (VAM), kopieret fra payload'en i browseren.
  board: {
    _id: "6ac63fc19013b4e1172fdd1e",
    factory: "VAM",
    boardName: "The Black Book",
    icon: "fa-book",
    assetSrc: "../../../assets/rockwool-polk.jpg",
    dontAskForPlannedDateChange: false,
  },

  taskType: 2, // 2 = Blå (Forbedring). Kræver ikke equipment.

  // Statusser i samme rækkefølge som i Eropex. Tallet er det, der sendes til Eropex.
  // Bekræftet: 0 = Ny, 1 = Igangsat. Resten antages at følge rækkefølgen i Eropex' liste.
  statuses: [
    { value: 0, label: "Ny" },
    { value: 1, label: "Igangsat" },
    { value: 2, label: "Venter" },
    { value: 3, label: "Venter Reservedel" },
    { value: 4, label: "Check" },
    { value: 5, label: "Afsluttet" },
  ],
  defaultStatus: 1, // Forvalgt i listen
  doneStatus: 5,    // "Afsluttet": her sættes også en afslutningsdato
};

// ---------- Planlagt dato ----------
const TZ = "Europe/Copenhagen";

// Dato/klokkeslæt i dansk tid som tal
function dkParts(date) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
  }).formatToParts(date).map((x) => [x.type, x.value]));
  return { y: +p.year, m: +p.month, d: +p.day, h: +p.hour, mi: +p.minute, s: +p.second };
}

// Planlagt dato = oprettelsesdagen (dansk tid). Lørdag/søndag rykkes tilbage til fredagen i samme uge.
// Eropex gemmer datoen som midnat UTC, fx "2026-10-08T00:00:00.000Z".
function plannedDateFor(now = new Date()) {
  const t = dkParts(now);
  const day = new Date(Date.UTC(t.y, t.m - 1, t.d));
  const wd = day.getUTCDay(); // 0 = søndag, 6 = lørdag
  if (wd === 6) day.setUTCDate(day.getUTCDate() - 1);
  if (wd === 0) day.setUTCDate(day.getUTCDate() - 2);
  return day;
}

// ---------- Login ----------
let session = null;      // { token, user }
let credentials = null;  // { username, password } – kun i hukommelsen

const $ = (id) => document.getElementById(id);

function show(el, type, text) {
  el.className = "msg " + type;
  el.textContent = text;
}

async function login(username, password) {
  let res;
  try {
    res = await fetch(`${CONFIG.apiBase}/users/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ username, password }),
    });
  } catch (e) {
    throw new Error("Kunne ikke kontakte Eropex. Tjek netværket, eller se konsollen (F12) for en CORS-fejl.");
  }
  if (res.status === 401 || res.status === 400) throw new Error("Forkert brugernavn eller password.");
  if (!res.ok) throw new Error(`Login fejlede (HTTP ${res.status}).`);

  const data = await res.json();
  // Svaret forventes at være brugerobjektet med et token-felt. Vi tåler også { user, token }.
  const user = data.user || data;
  const token = data.token || user.token;
  if (!token || !user._id) {
    console.log("Uventet login-svar:", data);
    throw new Error("Login-svaret havde ikke det forventede format. Se konsollen (F12).");
  }
  session = { token, user };
  credentials = { username, password };
  sessionStorage.setItem("bb_session", JSON.stringify(session));
  return session;
}

function restoreSession() {
  try {
    const saved = JSON.parse(sessionStorage.getItem("bb_session") || "null");
    if (saved && saved.token && saved.user) session = saved;
  } catch (e) { /* ignorer */ }
}

function updateView() {
  const loggedIn = !!session;
  $("loginCard").classList.toggle("hidden", loggedIn);
  $("taskCard").classList.toggle("hidden", !loggedIn);
  $("status").textContent = loggedIn
    ? `Logget ind som ${session.user.name || session.user.username}`
    : "Ikke logget ind";
  if (loggedIn) $("headline").focus();
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "Logger ind…";
  $("loginMsg").className = "msg";
  try {
    await login($("username").value.trim(), $("password").value);
    $("password").value = "";
    updateView();
  } catch (err) {
    show($("loginMsg"), "err", err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Log ind";
  }
});

// ---------- Opret opgave ----------
async function postTask(headline, description, status) {
  const now = new Date();
  const body = {
    involvedPersons: [],
    createdDate: now.toISOString(),
    board: CONFIG.board,
    headline,
    description,
    owner: session.user, // Eropex' egen webside sender hele brugerobjektet
    priority: null,
    status,
    type: CONFIG.taskType,
    typeCategory: null,
    plannedDate: plannedDateFor(now).toISOString(),
  };
  if (status === CONFIG.doneStatus) body.doneDate = now.toISOString();
  return fetch(`${CONFIG.apiBase}/tasks`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Accept: "application/json",
      Authorization: `Bearer ${session.token}`,
    },
    body: JSON.stringify(body),
  });
}

async function createTask(headline, description, status) {
  let res = await postTask(headline, description, status);

  if (res.status === 401 || res.status === 403) {
    // Token afvist: log ind igen, hvis vi kender passwordet, ellers bed om login
    if (credentials) {
      await login(credentials.username, credentials.password);
      res = await postTask(headline, description, status);
    } else {
      session = null;
      sessionStorage.removeItem("bb_session");
      updateView();
      throw new Error("Login er udløbet. Log ind igen.");
    }
  }
  if (res.status !== 201 && res.status !== 200) {
    const text = await res.text().catch(() => "");
    console.log("Eropex-svar:", res.status, text);
    throw new Error(`Opgaven blev ikke oprettet (HTTP ${res.status}). Se konsollen (F12).`);
  }
  return res.json();
}

$("taskForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("taskMsg");
  const btn = $("taskBtn");
  const headline = $("headline").value.trim();
  const status = Number($("taskStatus").value);
  let description = $("description").value.trim();

  if (!headline) {
    show(msg, "err", "Skriv en overskrift.");
    $("headline").focus();
    return;
  }
  // Tidspunkt for oprettelse i dansk tid (CET/CEST), formatet dd/mm/yyyy HH:MM
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Copenhagen", day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  const created = `${p.day}/${p.month}/${p.year} ${p.hour}:${p.minute}`;
  description = `${description}${description ? "\n\n" : ""}Oprettet: ${created}`;

  btn.disabled = true;
  btn.textContent = "Opretter…";
  msg.className = "msg";
  try {
    await createTask(headline, description, status);
    $("headline").value = "";
    $("description").value = "";
    $("taskStatus").value = CONFIG.defaultStatus;
    show(msg, "ok", "Tak! Opgaven er oprettet på The Black Book.");
  } catch (err) {
    show(msg, "err", err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Opret opgave";
  }
});

// Fyld statuslisten
for (const s of CONFIG.statuses) {
  const opt = new Option(s.label, s.value);
  if (s.value === CONFIG.defaultStatus) opt.selected = true;
  $("taskStatus").add(opt);
}

restoreSession();
updateView();
</script>
</body>
</html>
